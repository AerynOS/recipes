name        : noctalia
version     : "5.0.0-beta.4"
release     : 1
homepage    : https://github.com/noctalia-dev/noctalia
upstreams   :
    - https://github.com/noctalia-dev/noctalia/releases/download/v5.0.0-beta.4/noctalia-v5.0.0-beta.4.tar.gz : 53319101d752f24086804fb8d4997dc9c760106c6bdf68c71b4bea81c577f576
    - https://raw.githubusercontent.com/nothings/stb/master/stb_image_resize2.h :
        hash: 173e654634f6ccaad98f603e686ea212eec1fe8ea6d2a5e5e8056efa10ae3880
        unpack: false
    - https://raw.githubusercontent.com/nothings/stb/master/stb_image_write.h :
        hash: cbd5f0ad7a9cf4468affb36354a1d2338034f2c12473cf1a8e32053cb6914a05
        unpack: false
    - https://raw.githubusercontent.com/nothings/stb/master/stb_image.h :
        hash: 594c2fe35d49488b4382dbfaec8f98366defca819d916ac95becf3e75f4200b3
        unpack: false
summary     : A sleek, customizable desktop shell crafted for Wayland.
description : |
    Noctalia is a native Wayland desktop shell for people who want a polished, configurable Linux desktop without stitching together a separate bar, launcher, notification daemon, lock screen, wallpaper tool, and settings UI.
license     : 
    - MIT
builddeps   :
    - binary(git)
    - binary(sh)
    - binary(meson)
    - binary(ninja)
    - binary(pkgconf)
    - binary(gcc)
    - binary(wayland-scanner)
    - pkgconfig(cairo)
    - pkgconfig(cairo-ft)
    - pkgconfig(egl)
    - pkgconfig(epoxy)
    - pkgconfig(fontconfig)
    - pkgconfig(freetype2)
    - pkgconfig(gio-2.0)
    - pkgconfig(glesv2)
    - pkgconfig(glib-2.0)
    - pkgconfig(gobject-2.0)
    - pkgconfig(harfbuzz)
    - pkgconfig(jemalloc)
    - pkgconfig(libcurl)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libqalculate)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libsecret-1)
    - pkgconfig(libsodium)
    - pkgconfig(libwebp)
    - pkgconfig(libxml-2.0)
    - pkgconfig(md4c)
    - pkgconfig(nlohmann_json)
    - pkgconfig(pam)
    - pkgconfig(pango)
    - pkgconfig(pangocairo)
    - pkgconfig(pangoft2)
    - pkgconfig(polkit-agent-1)
    - pkgconfig(polkit-gobject-1)
    - pkgconfig(sdbus-c++)
    - pkgconfig(tomlplusplus)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-egl)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wayland-server)
    - pkgconfig(wireplumber-0.5)
    - pkgconfig(xkbcommon)
rundeps   :
    - curl
    - jemalloc
    - libglvnd
    - libqalculate
    - md4c
    - polkit
    - sdbus-cpp
    - tomlplusplus
    - cairo
    - fontconfig
    - freetype
    - glib2
    - pipewire
    - librsvg
    - libsecret
    - libsodium
    - libwebp
    - wireplumber
    - libxkbcommon
    - libxml2
    - pango
    - wayland
    - polkit
    - linux-pam
    - libepoxy
    - jemalloc

setup       : |
    export CXXFLAGS="$CXXFLAGS -Wno-unused-result"
    mkdir -p stb_compat/stb

    cp "%(sourcedir)/stb_image_resize2.h" stb_compat/stb/
    cp "%(sourcedir)/stb_image_write.h"   stb_compat/stb/
    cp "%(sourcedir)/stb_image.h"         stb_compat/stb/

    export CXXFLAGS="$CXXFLAGS -I$(pwd)/stb_compat"
    export CFLAGS="$CFLAGS -I$(pwd)/stb_compat"

    %meson \
      -Db_ndebug=true \
      -Dnative_optimizations=true \
      -Dtests=disabled

build       : |
    %meson_build
install     : |
    %meson_install
    %install_file LICENSE "%(installroot)/usr/share/licenses/%(name)/LICENSE"
    %install_file README.md "%(installroot)/usr/share/doc/%(name)/README.md"

