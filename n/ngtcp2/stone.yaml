name        : ngtcp2
version     : "1.25.0"
release     : 4
upstreams   :
    - https://github.com/ngtcp2/ngtcp2/releases/download/v1.25.0/ngtcp2-1.25.0.tar.gz : 1c0843076528a87b65e9a9d455100941f4cb65d44f96c5da6ae56df146043955
homepage    : https://nghttp2.org/ngtcp2/
license     : MIT
summary     : QUIC protocol implementation
description : |
    ngtcp2 project is an effort to implement IETF QUIC protocol
builddeps   :
    - pkgconfig(gnutls)
    - pkgconfig(libnghttp3)
    - pkgconfig(openssl)
    # libev
setup       : |
    %configure \
        --disable-static \
        --with-gnutls \
        --with-openssl
build       : |
    %make
install     : |
    %make_install
check       : |
    %make check
packages    :
    - "%(name)-crypto-gnutls":
        summary: gnutls support for %(name)
        description: gnutls support for %(name)
        paths:
            - /usr/lib/libngtcp2_crypto_gnutls.so.*

    - "%(name)-devel":
        rundeps:
            - "%(name)-crypto-gnutls"
