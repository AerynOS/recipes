name: 💻 Hardware Enablement
description: File a report for the hardware you would like enabled to aerynOS.
title: "[Hardware Enablement Report]: <Hardware make & model>"
labels: ["hardware enablement"]
assignees: ["pkg-staff"]

body:
  - type: markdown
    attributes:
      value: |
        ## Hardware enablement request

        Thanks for taking the time to fill out this hardware report! Your interest in aerynOS is appreciated and we hope to better support your hardware in time.

  - type: checkboxes
    id: policy_acknowledgement
    attributes:
      label: Check list of acknowledgements
      description: Confirm that you have completed the following before proceeding
      options:
        - label: I have ensured that my system is fully updated to the latest repository stream update.
          required: true
        - label: I have searched for existing [requests](https://github.com/AerynOS/recipes/issues?q=is%3Aissue%20is%3Aopen%20label%3A%22hardware%20enablement%22) and confirmed this hasn't been requested before.
          required: true

  - type: dropdown
    id: repository_choice
    attributes:
      label: Which repository are you currently using?
      options:
        - Unstable
        - Volatile

  - type: dropdown
    id: desktop_environment
    attributes:
      label: Desktop Environment or Window Manager
      options:
        - Cosmic
        - GNOME
        - Hyprland
        - KDE Plasma
        - MangoWM
        - Niri
        - Sway
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What hardware is not working?
      description: Please explain what hardware did not work. Whether the whole computer did not work or specific pieces of hardware (eg. wifi or webcam etc)
      placeholder: Tell us what you see!
      value: "Please fill in the details here!"
    validations:
      required: true

  - type: textarea
    id: logs-lspci-good
    attributes:
      label: lspci output from known good distro
      description: Please copy and paste the output of 'sudo lspci -vnn' from a known good distro. It is helpful to understand which drivers are in use. This will be automatically formatted into code, so no need for backticks.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs-lspci-aerynOS
    attributes:
      label: lspci output from aerynOS
      description: Please copy and paste the output of 'sudo lspci -vnn' from aerynOS. If the command does not work, install using 'sudo moss install pciutils'. This will be automatically formatted into code, so no need for backticks.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs-lsusb
    attributes:
      label: lsusb output from within aerynOS
      description: Please copy and paste the output of 'sudo lsusb' from aerynOS. If the command does not work, install using 'sudo moss install usbutils'. This will be automatically formatted into code, so no need for backticks.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs-dmidecode
    attributes:
      label: dmidecode output from within aerynOS
      description: Please copy and paste the output of 'sudo dmidecode' from aerynOS. If the command does not work, install using 'sudo moss install dmidecode'. This will be automatically formatted into code, so no need for backticks.
      render: shell
    validations:
      required: true

  - type: textarea
    id: system
    attributes:
      label: System details
      description: Provide the output of 'inxi -b' from command line. If the command does not work, install using 'sudo moss install inxi'.
    validations:
      required: true

  - type: textarea
    id: additional_info
    attributes:
      label: Additional Information (Optional)
      description: Any other details that might help us diagnose the issue.
      placeholder: e.g. "I found this relevant bug report..."

  - type: markdown
    attributes:
      value: |
        ---

        Hardware enablement is prioritised based on user demand and packager availability. You may be asked to research how to enable your hardware yourself if capacity is limited. Please note that there may be a delay in wider hardware enablement whilst the project is currently in the alpha development stage.
