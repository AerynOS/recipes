name        : plasma-workspace-wallpapers
version     : "6.7.4"
release     : 21
upstreams   :
    - https://download.kde.org/stable/plasma/6.7.4/plasma-workspace-wallpapers-6.7.4.tar.xz : d0bab9b0182480a41fe0c677a1f5d4d1c3088e0f3aa6883a0bc25423d94ecfd0
