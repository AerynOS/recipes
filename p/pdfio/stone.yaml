name        : pdfio
version     : "1.6.4"
release     : 2
upstreams   :
    - https://github.com/michaelrsweet/pdfio/releases/download/v1.6.4/pdfio-1.6.4.tar.gz : 1b5e5e945f4fc214b55d575554c1aec11d7ba91b397cef92ffe877462155af06
homepage    : https://www.msweet.org/pdfio
license     : Apache-2.0
summary     : A simple C library for reading and writing PDF files
description : |
    A simple C library for reading and writing PDF files
builddeps   :
    - pkgconfig(zlib)
setup       : |
    %configure \
        --disable-static \
        --enable-shared
build       : |
    %make \
        AR=${AR}
install     : |
    %make_install
packages    :
    - "%(name)-examples":
        paths:
            - /usr/share/doc/pdfio/examples/
