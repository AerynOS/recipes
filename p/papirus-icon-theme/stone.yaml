name        : papirus-icon-theme
version     : "20260801"
release     : 5
homepage    : https://github.com/PapirusDevelopmentTeam/papirus-icon-theme
upstreams   :
    - https://github.com/PapirusDevelopmentTeam/papirus-icon-theme/archive/refs/tags/20260801.tar.gz : 646f622e9e7e9e65eef9d0ab58999d4920ddb33d98e6a75232627cfe3bd508f9
summary     : Papirus Icon Theme
description : |
    Papirus Icon Theme
license     : GPL-3.0-or-later
builddeps   :
    - binary(gtk-update-icon-cache)
    - hicolor-icon-theme
build       : |
    %make
install     : |
    %make_install

    for i in %(installroot)%(datadir)/icons/*/; do
        gtk-update-icon-cache -f $i
    done
