name        : wmenu
version     : "0.2.0"
release     : 3
homepage    : https://codeberg.org/adnano/wmenu
upstreams   :
    - https://codeberg.org/adnano/wmenu/archive/0.2.0.tar.gz : b1b593a80310085a90bd349d458ffbcfacf875d74468ae4428bdf5692a671ef9
summary     : Wayland-native dmenu replacement which maintains the look and feel of dmenu
description : |
    wmenu is an efficient dynamic menu for Sway and wlroots based Wayland compositors. It provides a Wayland-native dmenu replacement which maintains the look and feel of dmenu
license     : MIT
builddeps   :
    - binary(scdoc)
    - pkgconfig(cairo)
    - pkgconfig(pango)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - pkgconfig(xkbcommon)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
