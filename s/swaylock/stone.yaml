name        : swaylock
version     : "1.8.6"
release     : 4
homepage    : https://github.com/swaywm/swaylock
upstreams   :
    - https://github.com/swaywm/swaylock/releases/download/v1.8.6/swaylock-1.8.6.tar.gz : a15154348fef852fdb224112d137c393c826478b777f63479beb15e8d3812eaf
summary     : Screen locking utility for wayland compositors
description : |
    Screen locking utility for wayland compositors
license     :
    - MIT
builddeps   :
    - binary(scdoc)
    - pkgconfig(cairo)
    - pkgconfig(gdk-pixbuf-2.0)
    - pkgconfig(libcrypt)
    - pkgconfig(pam)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wayland-scanner)
    - pkgconfig(xkbcommon)
setup       : |
    %patch %(pkgdir)/stateless.patch
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
