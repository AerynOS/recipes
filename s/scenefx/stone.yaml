name        : scenefx
version     : "0.5"
release     : 4
homepage    : https://github.com/wlrfx/scenefx
upstreams   :
    - https://github.com/wlrfx/scenefx/archive/refs/tags/0.5.tar.gz : 0fa8ecca0e310f813efd052624c5ed7d9153d6a0fdead5cc957d34c07f9a86c6
summary     : A drop-in replacement for the wlroots scene API that allows wayland compositors to render surfaces with eye-candy effects
description : |
    scenefx is a drop-in replacement for the wlroots scene API that replaces the
    wlr renderer with an fx renderer capable of rendering surfaces with eye-candy
    effects including blur, shadows, and rounded corners, while maintaining the
    simplicity of the original scene API.
license     :
    - MIT
builddeps   :
  - binary(glslangValidator)
  - pkgconfig(libdrm)
  - pkgconfig(libglvnd)
  - pkgconfig(pixman-1)
  - pkgconfig(wayland-protocols)
  - pkgconfig(wayland-server)
  - pkgconfig(wlroots)
  - pkgconfig(xkbcommon)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install

    # Create an unversioned symlink so we can continue to use `pkgconfig(scenefx)`
    ln -sv scenefx-$(echo %(version) | cut -d. -f1).$(echo %(version) | cut -d. -f2).pc %(installroot)/%(libdir)/pkgconfig/scenefx.pc
packages    :
    - "%(name)":
        summary: SceneFX runtime library
        paths:
            - /usr/lib*/*.so
