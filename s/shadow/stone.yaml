name        : shadow
version     : "4.20.0"
release     : 10
summary     : PAM-using login and passwd utilities
license     : BSD-3-Clause
homepage    : https://github.com/shadow-maint/shadow
description : |
    PAM-using login and passwd utilities
upstreams   :
    - https://github.com/shadow-maint/shadow/releases/download/4.20.0/shadow-4.20.0.tar.xz: 239781632846db3b01901028147fb4b57e6f2d5330ca63ce104b21d9b3e6031f
builddeps   :
    - binary(msgfmt)
    - binary(xsltproc)
    - pkgconfig(libacl)
    - pkgconfig(libattr)
    - pkgconfig(libcrypt)
    - pkgconfig(libeconf)
    - pkgconfig(libsystemd)
    - pkgconfig(pam)
setup       : |
    %patch %(pkgdir)/0001-aeryn-login.defs-changes.patch
    %patch %(pkgdir)/stateless/0001-Stateless-useradd-support.patch
    %patch %(pkgdir)/ftbfs-upstream-01.patch

    %configure \
        --enable-man \
        --enable-vendordir=%(vendordir) \
        --with-yescrypt \
        --without-libbsd \
        --without-su \
        --disable-static
build       : |
    %make
install     : |
    %make_install

    # Manually install man pages
    %install_dir %(installroot)/%(mandir)
    cp -r --preserve=timestamps man/man* %(installroot)/%(mandir)/

    # Stateless
    %install_dir %(installroot)%(vendordir)
    mv %(installroot)/etc/login.defs %(installroot)%(vendordir)

    # Part of sudo/util-linux
    rm -rfv %(installroot)%(mandir)/man1/su.1* \
            %(installroot)%(mandir)/man8/sulogin.8*

    # Stateless PAM
    %install_dir %(installroot)/%(vendordir)
    mv %(installroot)/etc/pam.d %(installroot)/%(vendordir)/
    # Replace with ours
    rm -v %(installroot)/%(vendordir)/pam.d/passwd
    for i in passwd chgpasswd chpasswd newusers; do
        %install_file %(pkgdir)/pam.d/$i %(installroot)/%(vendordir)/pam.d/
    done
    for i in groupadd groupdel groupmod useradd usermod userdel; do
        %install_file %(pkgdir)/pam.d/defaults %(installroot)/%(vendordir)/pam.d/$i
    done

    # Remove files that conflict with util-linux
    # Expect vipw, vigr, newgrp, sg to conflict also at a later point
    for file in login nologin chfn chsh; do
        find %(installroot)/usr -wholename "*bin/${file}*" -type f -print -exec rm {} \; # binaries
        find %(installroot)%(vendordir) -name "${file}" -type f -print -exec rm {} \; # pam files
        find %(installroot)%(mandir) -regextype posix-extended -regex ".*/${file}.[0-9]" -type f -print -exec rm {} \; # man pages
    done

    # Ensure /etc/sub{g,u}id files exist
    %tmpfiles "f /etc/subuid 0644 root root -"
    %tmpfiles "f /etc/subgid 0644 root root -"
