name        : suitesparse
version     : "7.12.3"
release     : 2
homepage    : https://github.com/DrTimothyAldenDavis/SuiteSparse
upstreams   :
    - https://github.com/DrTimothyAldenDavis/SuiteSparse/archive/refs/tags/v7.12.3.tar.gz : 158ee4ed2ce3fdcbf52c4e47e94b0d1a8ae13344b4a835991d78a3ad20f08086
summary     : A suite of sparse matrix algorithms
description : |
    SuiteSparse is a set of sparse-matrix-related packages written or co-authored by Tim Davis
license     :
    - GPL-2.0-or-later
    - LGPL-3.0-or-later
builddeps   :
    - binary(flang)
    - pkgconfig(gmp)
    - pkgconfig(mpfr)
    - pkgconfig(openblas)
    - pkgconfig(tbb)
    # - cuda
setup       : |
    # 2026-04-27: Added cholmod, klu, and umfpack for eigen
    _projects="cholmod;klu;umfpack"

    %cmake \
      -DBLA_VENDOR=OpenBLAS \
      -DBUILD_STATIC_LIBS=OFF \
      -DINTERNAL_METIS=ON \
      -DSUITESPARSE_ENABLE_PROJECTS="${_projects}" \
      -DSUITESPARSE_USE_CUDA=OFF \
      -DSUITESPARSE_USE_STRICT=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
