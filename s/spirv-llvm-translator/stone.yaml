name        : spirv-llvm-translator
version     : "22.1.4"
release     : 20
homepage    : https://github.com/KhronosGroup/SPIRV-LLVM-Translator
upstreams   :
    - https://github.com/KhronosGroup/SPIRV-LLVM-Translator/archive/refs/tags/v22.1.5.tar.gz: 3c6dffb4b8d67f5c544370e0c869ec7d22c013d4bb798f24655ec903f26cc5d5
summary     : Tool/library for translation between SPIR-V and LLVM IR
description : |
    A tool and a library for bi-directional translation between SPIR-V and LLVM IR
license     :
    - Apache-2.0 WITH LLVM-exception
builddeps  :
    - binary(llvm-config-22)
    - pkgconfig(SPIRV-Tools)
setup       : |
    %cmake \
        -DBUILD_SHARED_LIBS=ON \
        -DLLVM_EXTERNAL_SPIRV_HEADERS_SOURCE_DIR=/usr/include/spirv
build       : |
    %cmake_build
install     : |
    %cmake_install
