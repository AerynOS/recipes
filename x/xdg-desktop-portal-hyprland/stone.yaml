name        : xdg-desktop-portal-hyprland
version     : "1.4.1"
release     : 6
upstreams   :
    - https://github.com/hyprwm/xdg-desktop-portal-hyprland/archive/refs/tags/v1.4.1.tar.gz : 3652c14f63a9666acea2c841e196782dbc0f74ea5b4783622dd04a32f08b709f
homepage    : https://github.com/hyprwm/xdg-desktop-portal-hyprland
license     : BSD-3-Clause
summary     : xdg-desktop-portal backend for hyprland
description : |
    xdg-desktop-portal backend for hyprland
builddeps   :
    - pkgconfig(Qt6Core)
    - pkgconfig(gbm)
    - pkgconfig(hyprland-protocols)
    - pkgconfig(hyprlang)
    - pkgconfig(hyprutils)
    - pkgconfig(hyprwayland-scanner)
    - pkgconfig(libdrm)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libspa-0.2)
    - pkgconfig(sdbus-c++)
    - pkgconfig(uuid)
    - pkgconfig(wayland-protocols)
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
