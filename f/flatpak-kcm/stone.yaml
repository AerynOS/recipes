name        : flatpak-kcm
version     : "6.7.4"
release     : 21
upstreams   :
    - https://download.kde.org/stable/plasma/6.7.4/flatpak-kcm-6.7.4.tar.xz : 1133b40e4d7fad2349a84b5e0f12acaaa22a0940fa4fc1500e2c79482535e219
homepage    : https://kde.org/plasma-desktop/
license     : GPL-2.0-or-later
summary     : Flatpak Permissions Management KCM
description : |
    Flatpak Permissions Management KCM
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6ItemModels)
    - cmake(KF6KCMUtils)
    - cmake(KF6Service)
    - cmake(Qt6Quick)
    - cmake(Qt6Svg)
    - pkgconfig(flatpak)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
