name        : intel-media-driver
version     : "26.2.4" # Update-checker will return additional tags, but these are testing releases. Only use versions that are in the "releases"
release     : 7
homepage    : https://github.com/intel/media-driver
upstreams   :
    - https://github.com/intel/media-driver/archive/refs/tags/intel-media-26.2.4.tar.gz : a23185fca05c8fa8bdec09ea9ee8a20361163c87035ec978de4e2bb048a55534
summary     : VA-API driver for Intel Gen graphics
description : |
    VA-API driver for Intel Gen graphics
license     :
    - BSD-3-Clause
    - MIT
builddeps   :
    - pkgconfig(igdgmm)
    - pkgconfig(libva)
    - pkgconfig(x11)
setup       : |
    # error: variable length arrays in C++ are a Clang extension (MEDIA_BUILD_FATAL_WARNINGS=OFF)
    %cmake \
        -DMEDIA_RUN_TEST_SUITE:BOOL=False \
        -DMEDIA_BUILD_FATAL_WARNINGS=OFF \
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5
build       : |
    %cmake_build
install     : |
    %cmake_install
tuning      :
    - lto: full
    - optimize: speed
packages    :
    - "libva-intel-media-driver":
        summary: The Intel Media Driver for VAAPI
        description: The Intel Media Driver for VAAPI
        paths:
            - /usr/lib/dri/

    - "libigfxcmrt":
        summary: Intel library to load GPU kernels
        rundeps:
            - libva-intel-media-driver
        paths:
            - /usr/lib/libigfxcmrt.so.*

    - "libigfxcmrt-devel":
        summary: Intel library to load GPU kernels - devel
        rundeps:
            - libigfxcmrt
        paths:
            - /usr/include/igfxcmrt/
            - /usr/lib/libigfxcmrt.so
            - /usr/lib/pkgconfig/igfxcmrt.pc
