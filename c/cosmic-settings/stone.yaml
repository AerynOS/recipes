name        : cosmic-settings
version     : "1.5.0"
release     : 55
summary     : Cosmic Desktop Settings
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-settings
upstreams   :
    - https://github.com/pop-os/cosmic-settings/archive/823ef166f96330bda4f530aaf8395c9b054d3eec.tar.gz : c00a43d1ca7711e96492693e0bc99d07712064c25c9b1300d699ddf987ae5d6e
description : |
    Cosmic Desktop Settings
builddeps   :
    - binary(just)
    - pkgconfig(dav1d)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(nm-connection-editor)
    - binary(pipewire-pulse)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
