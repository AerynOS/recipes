name        : cosmic-session
version     : "1.5.0"
release     : 59
summary     : Cosmic Session Management
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-session
upstreams   :
    - https://github.com/pop-os/cosmic-session/archive/b5ef6c0c0d68762b2991e4f5906cc70599e2f1fc.tar.gz : 9ded1802b9cbb95d2eb5228ef5656404a9eb60afa6d00ae0051226e017668137
description : |
    Cosmic Session Management
builddeps   :
    - binary(just)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(awk)
    - binary(boltctl)
    - binary(cosmic-app-library)
    - binary(cosmic-bg)
    - binary(cosmic-comp)
    - binary(cosmic-files)
    - binary(cosmic-greeter)
    - binary(cosmic-idle)
    - binary(cosmic-notifications)
    - binary(cosmic-osd)
    - binary(cosmic-panel)
    - binary(cosmic-randr)
    - binary(cosmic-settings)
    - binary(cosmic-settings-daemon)
    - binary(cosmic-workspaces)
    - binary(gnome-keyring)
    - binary(switcherooctl)
    - binary(update-desktop-database)
    - binary(update-mime-database)
    - binary(upower)
    - binary(xdg-user-dirs-gtk-update)
    - accountsservice
    - font-noto
    - font-opensans
    - pciutils
    - wireplumber
    - xdg-desktop-portal-cosmic
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install

    %install_file data/dconf/profile/cosmic %(installroot)%(datadir)/dconf/profile/cosmic
