name        : cosmic-term
version     : "1.5.0"
release     : 50
homepage    : https://github.com/pop-os/cosmic-term
upstreams   :
    - https://github.com/pop-os/cosmic-term/archive/refs/tags/epoch-1.5.0.tar.gz : ea942a519c33c6bc13dddfdd8c5addfc4307742c1f892fa67807646fc6db42bc
summary     : Cosmic Desktop Terminal Application
description : |
    Cosmic desktop Terminal Application
license     :
    - GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
