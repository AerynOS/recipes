name        : cardwire
version     : "0.11.1"
release     : 3
summary     : A GPU Manager for linux that uses eBPF LSM hooks to block GPUs
license     : GPL-3.0-only
homepage    : https://github.com/OpenGamingCollective/cardwire
upstreams   :
    - https://github.com/OpenGamingCollective/cardwire/archive/refs/tags/v0.11.1.tar.gz :  46177bfa427bcb277c29718ee0eb421dcdb31dba33697019741ad56c4c1d7ba8
description : |
    A GPU Manager for linux that uses eBPF LSM hooks to block GPUs 
builddeps   :
    - pkgconfig(dbus-1)
    - pkgconfig(libbpf)
    - pkgconfig(libudev)
rundeps     :
    - binary(upower)
    - hwdata
    - systemd
networking  : true
environment : |
    export RUSTUP_TOOLCHAIN=stable
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %install_exe target/x86_64-unknown-linux-gnu/release/cardwire "%(installroot)%(bindir)/cardwire"
    %install_exe target/x86_64-unknown-linux-gnu/release/cardwired "%(installroot)%(bindir)/cardwired"
    %install_exe target/x86_64-unknown-linux-gnu/release/cardwire-gui "%(installroot)%(bindir)/cardwire-gui"
    %install_file assets/cardwired.service "%(installroot)%(libdir)/systemd/system/cardwired.service"
    %install_file assets/com.github.opengamingcollective.cardwire.conf "%(installroot)%(datadir)/dbus-1/system.d/com.github.opengamingcollective.cardwire.conf"
    %install_file assets/cardwire-gui.desktop "%(installroot)%(datadir)/applications/cardwire-gui.desktop"
    for icon in assets/icons/*.svg; do
        %install_file "$icon" "%(installroot)%(datadir)/icons/hicolor/scalable/apps/$(basename "$icon")"
    done
    %install_file LICENSE "%(installroot)%(datadir)/licenses/%(name)/LICENSE"
