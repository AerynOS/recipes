name        : cosmic-applibrary
version     : "1.5.0"
release     : 48
summary     : Cosmic Desktop App Launcher
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-applibrary
upstreams   :
    - https://github.com/pop-os/cosmic-applibrary/archive/172acdae07aeb78a554813a566c0f8b942dcc831.tar.gz : f441c73c4dd8d3d837e0ba1afdc4170c17de44f76a8f56f43bbbbfe0c8f3cf03
description : |
    Cosmic Desktop App Launcher
builddeps   :
    - binary(just)
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
