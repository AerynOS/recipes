name        : chromaprint
version     : "1.6.1"
release     : 2
upstreams   :
    - https://github.com/acoustid/chromaprint/releases/download/v1.6.1/chromaprint-1.6.1.tar.gz : 3368805af0ee47b9df74df10b5001a44569e01df2844dab520031720dde9ad23
homepage    : https://acoustid.org/chromaprint
license     : LGPL-2.1-or-later
summary     : Library for extracting fingerprints from any audio source
description : |
    Library for extracting fingerprints from any audio source
builddeps   :
    - pkgconfig(fftw3)
    - pkgconfig(libavcodec)
    - pkgconfig(libavdevice)
    - pkgconfig(libavformat)
    - pkgconfig(libavutil)
    - pkgconfig(libswresample)
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
