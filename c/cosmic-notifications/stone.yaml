name        : cosmic-notifications
version     : "1.5.0"
release     : 47
summary     : Cosmic Desktop Notifications
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-notifications
upstreams   :
    - https://github.com/pop-os/cosmic-notifications/archive/7c723b7705ec77b1ad5396a1baa9ae1c0cb5a0da.tar.gz : 7ae0c6b0badb8d392f7e1cf7a85b07f10b2ce590e0c4f2be92bdb3d28b7aa1cf
description : |
    Cosmic Desktop Notifications
builddeps   :
    - binary(just)
    - binary(which)
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
