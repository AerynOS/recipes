name        : cosmic-panel
version     : "1.5.0"
release     : 48
summary     : Cosmic Desktop Panel
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-panel
upstreams   :
    - https://github.com/pop-os/cosmic-panel/archive/d6699ffc423a3830bf4cab7e2c7f08a173e998f0.tar.gz : 6baad1b138a68a335c9247a7271b86df72fe02ea1b36e42bbfe8e0991d90fa65
description : |
    Cosmic Desktop panel
builddeps   :
    - binary(just)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(cosmic-applets)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    RUST_BACKTRACE=1 %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
