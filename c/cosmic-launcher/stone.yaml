name        : cosmic-launcher
version     : "1.5.0"
release     : 48
summary     : Cosmic Desktop Launcher
license     : GPL-3.0
homepage    : https://github.com/pop-os/cosmic-launcher
upstreams   :
    - https://github.com/pop-os/cosmic-launcher/archive/585a8c0c98d0385a91942c7f0e54d7ab209c1e79.tar.gz : 3958346b87a738ef1a8075f0746aac62a70dcf4b89cef3704bd12678327ac560
description : |
    Cosmic Desktop Launcher
builddeps   :
    - binary(just)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(pop-launcher)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
