name        : crun
version     : "1.29"
release     : 5
homepage    : https://github.com/containers/crun
upstreams   :
    - https://github.com/containers/crun/releases/download/1.29/crun-1.29.tar.zst : d4846ce8407cd78ea322bc7daa8a75f7cbd2648a22eca4e388b84b87510b8352
summary     : A fast and low-memory footprint OCI Container Runtime fully written in C
description : |
    A fast and lightweight fully featured OCI runtime and C library for running containers
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    - binary(go-md2man)
    - binary(gperf)
    - binary(python3)
    - pkgconfig(json-c)
    - pkgconfig(libblake3)
    - pkgconfig(libcap)
    - pkgconfig(libseccomp)
    # - pkgconfig(python3)
    - pkgconfig(systemd)
    # criu
setup       : |
    # What even uses the python bindings? They shouldn't be re-enabled until there's a note here what they're for
    %configure \
        --disable-static \
        --enable-shared \
        --without-python-bindings
build       : |
    %make
install     : |
    %make_install
