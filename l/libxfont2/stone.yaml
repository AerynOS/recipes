name        : libxfont2
version     : "2.0.9"
release     : 5
homepage    : https://gitlab.freedesktop.org/xorg/lib/libxfont
upstreams   :
    - https://www.x.org/archive/individual/lib/libXfont2-2.0.9.tar.xz : f042a370666815e7b941e9b7019024755bd1c6c2954afbfa515af378251799e2
summary     : X font handling library for server & utilities
description : |
    X font handling library for server & utilities
license     :
    - MIT
builddeps   :
    - pkgconfig(fontenc)
    - pkgconfig(fontsproto)
    - pkgconfig(freetype2)
