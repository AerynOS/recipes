name        : lichen-installer
version     : "0.1.0+git.f124f9d"
release     : 1
summary     : OS installer
license     : MPL-2.0
homepage    : https://github.com/AerynOS/lichen-installer
upstreams   :
    - git|https://github.com/AerynOS/lichen-installer.git :
         ref : c8df396cf43f5a3b0e08c325bc399b38d0b9e6c0
description : |
    Experimental OS installer
builddeps   :
    - binary(cargo)
    - pkgconfig(protobuf)
networking  : true
rundeps     :
    - binary(btrfs)
    - binary(moss)
    - iso-codes
    - sysbinary(mkfs.bcachefs)
    - sysbinary(mkfs.ext4)
    - sysbinary(mkfs.f2fs)
    - sysbinary(mkfs.vfat)
    - sysbinary(mkfs.xfs)
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install lichen_cli
    %cargo_install lichen_backend
    %install_file %(pkgdir)/lichen-installer.desktop -t %(installroot)/%(datadir)/applications/
    %install_file %(pkgdir)/org.freedesktop.policykit.pkexec.lichen-installer.policy -t %(installroot)/%(datadir)/polkit-1/actions/
    %install_exe %(pkgdir)/lichen-cli.sh %(installroot)%(bindir)/lichen
