name        : libime
version     : "1.1.15"
release     : 1
homepage    : https://github.com/fcitx/libime
upstreams   :
    - https://github.com/fcitx/libime/archive/refs/tags/1.1.15.tar.gz:
        hash: e8ce7b90035aeafa5ce5f59a05f84d6c192fcecc009b2e74cf179bc18b21eaf5
        unpackdir: ime
    - git|https://github.com/kpu/kenlm.git:
        ref: 4cb443e60b7bf2c0ddf3c745378f76cb59e254e5
        clonedir: ime/src/libime/core/kenlm
    - https://download.fcitx-im.org/data/lm_sc.arpa-20260606.tar.zst:
        hash: 8c7da1b03770060269b92c0e6172552a2a9041cb74ef0be0b2659e10f0a703f1
        unpack: false
    - https://download.fcitx-im.org/data/dict-20260430.tar.zst:
        hash: 3edc008d90fcd61b9967b9e590f396189d7a00fa74c45ecde0d9850a0fdd6241
        unpack: false
    - https://download.fcitx-im.org/data/table-20240108.tar.zst:
        hash: 3e9d87b04a393f131723472c8eaa860dd23c378a3d4f6a9005513b2a95b3614b
        unpack: false
summary     : A library to support generic input method implementation
description : |
    A library to support generic input method implementation
license     : LGPL-2.1-or-later
builddeps   :
    - cmake(Boost)
    - cmake(ECM)
    - cmake(Fcitx5Utils)
setup       : |
    # Verify version match with CMakeLists.txt. If not match, update
    for file in %(sourcedir)/{lm_sc.arpa,dict,table}-*.tar.zst; do
        mv "${file}" data/
        grep -F "$(basename "${file}")" data/CMakeLists.txt
    done

    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
    %break_exit
