name        : lazygit
version     : "0.64.0"
release     : 11
homepage    : https://github.com/jesseduffield/lazygit
upstreams   :
    - https://github.com/jesseduffield/lazygit/archive/refs/tags/v0.64.0.tar.gz : 2d41928fd3c6355022f0876ac5b8abc89ece40bf3ab9b8353f254d420d938201
summary     : A simple terminal UI for git commands
description : |
    A simple terminal UI for git commands
license     : MIT
builddeps   :
    - binary(go)
build       : |
    go build -v \
        -gcflags='all=-N -l' \
        -ldflags "\
        -X main.version=%(version) \
        -X main.commit=v%(version) \
        "
install     : |
    %install_bin lazygit
    %install_file LICENSE -t %(installroot)%(datadir)/licenses/%(name)/
tuning      :
    - golang-modflags: false
