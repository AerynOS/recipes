name        : lutris
version     : "0.5.22-git.9f1043b"
release     : 1
homepage    : https://github.com/lutris/lutris
upstreams   :
    - git|https://github.com/lutris/lutris.git : 9f1043b1770ac9b326540ef9bc04f6daf4dc3311 # master
    - git|https://github.com/bartok765/galaxy_blizzard_plugin.git : 83cfb024ebc00cbc71702f101671bea596cfc96f # master
summary     : Lutris desktop client
description : |
    Open Gaming Platform
license     : 
    - GPL-3.0
builddeps   :
    - pkgconfig(protobuf)
    - binary(gettext)
rundeps     :
    - cabextract
    - curl
    - gdk-pixbuf
    - glib2
    - gnome-desktop
    - gobject-introspection-runtime
    - gtk-3
    - hicolor-icon-theme
    - p7zip
    - pango
    - psmisc
    - python
    - python-cairo
    - python-certifi
    - python-dbus
    - python-distro
    - python-evdev
    - python-pygobject
    - python-lxml
    - python-pillow
    - python-requests
    - python-urllib3
    - python-pyyaml
    - unzip
    - webkit2gtk41
    - vulkan-loader-32bit
    - libglvnd-32bit
    - python-protobuf
# need but no package for now
#   - python-moddb
#   - libgnutls-32bit
setup       : |
    # Regenerate protos to fix BattleNet plugin
    # See https://gitlab.archlinux.org/archlinux/packaging/packages/lutris/-/issues/4
    # And https://github.com/lutris/lutris/issues/5659
    protoc --proto_path=../galaxy_blizzard_plugin.git/src --python_out=. product_db.proto
    cp -vf product_db_pb2.py lutris/util/battlenet/product_db_pb2.py
    %meson
build       : |
    %meson_build
install     : |
    %meson_install


