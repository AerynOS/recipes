name        : libmicrohttpd
version     : "1.0.9"
release     : 12
homepage    : https://www.gnu.org/software/libmicrohttpd
upstreams   :
    - https://ftp.gnu.org/gnu/libmicrohttpd/libmicrohttpd-1.0.9.tar.gz : 6e9adc446b08083ec03d40317fb66ca6f2e03e4f6170aef33a6e59bb08db2012
summary     : C library supposed to make it easy to run an embedded HTTP server
description : |
    GNU libmicrohttpd is a small C library that is supposed to make it easy to run an HTTP server as part of another application. GNU Libmicrohttpd is free software and part of the GNU project.
license     : LGPL-2.1-or-later
builddeps   :
    - pkgconfig(gnutls)
#checkdeps   :
#    - pkgconfig(libcurl)
setup       : |
    %configure \
        --disable-static
build       : |
    %make
install     : |
    %make_install
#check       : |
#    %make check
