name        : opengamepadui
version     : "0.46.0"
release     : 30
homepage    : https://github.com/ShadowBlip/OpenGamepadUI
upstreams   :
    - https://github.com/ShadowBlip/OpenGamepadUI/archive/refs/tags/v0.46.0.tar.gz : 81bbcf442b9ef10d2332ecb2279c8b46f8c76aa9d42b5fc43d7a36b228714fdf
    - https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip :
        hash: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
        rename: godot.zip
        unpack: false 
summary     : Open source gamepad-native game launcher and overlay
description : |
    Open Gamepad UI is a free and open source game launcher and overlay written using the Godot Game Engine 4 designed with a gamepad native experience in mind.
    Its goal is to provide an open and extendable foundation to launch and play games. It also implements a gamepad input system that can allow you to remap
    gamepad input to mouse and keyboard inputs.
license     : GPL-3.0-or-later
networking  : true
builddeps   :
    - binary(cargo)
    - binary(unzip)
    - binary(wget)
    - pkgconfig(fontconfig)
    - sysbinary(setcap)
rundeps     :
    - binary(brightnessctl)
    - binary(glxinfo)
    - binary(inputplumber)
    - binary(vulkaninfo)
environment : |
    export GODOT="godot.bin"
    export PATH=".:${PATH}"
setup       : |
    # Vendored godot binary. Only used for generating assets during the install phase.
    # Won't be included in %(installroot) and thus won't get installed to user systems.
    bsdtar-static --no-same-owner -xf %(sourcedir)/godot.zip --strip-components=0
    # We don't care which version it is, as long as it's linux.x86_64
    ln ./Godot*linux.x86_64 ${GODOT}
    _MSG="Vendored godot binary ${GODOT} not executable. Exiting."
    [[ -f "${GODOT}" && -x "${GODOT}" ]] || { echo "${_MSG}" && exit 1 ;}

    # Workaround to have decent default settings. We need to create a new platform on OGUI
    %patch %(pkgdir)/use-chimeraos-defaults.patch
    # Enables OGUI to start properly
    %patch %(pkgdir)/fix-prefix.patch
    # Be more verbose to be able to debug better
    %patch %(pkgdir)/debug.patch
    # Currently '-steamos3' flag is preventing 'steam' to be launched on AerynOS.
    # Additionally we enable more options in overlaymode to compensate missing features
    # of GamepadUI which SteamDeck mode would provide.
    %patch %(pkgdir)/aerynos.patch

    cd extensions
    %cargo_fetch
build       : |
    %make
install     : |
    %make_install PREFIX=%(installroot)/%(prefix)
