name        : openblas
version     : "0.3.34"
release     : 12
homepage    : https://github.com/OpenMathLib/OpenBLAS
upstreams   :
    - https://github.com/OpenMathLib/OpenBLAS/archive/refs/tags/v0.3.34.tar.gz : cd7e129868320cc2d033afa920e31202dfe0b8066a5b66661900ccc0f197dfed
summary     : OpenBLAS is an optimized BLAS library based on GotoBLAS2 1.13 BSD version
description : |
    OpenBLAS is an optimized BLAS library based on GotoBLAS2 1.13 BSD version
license     : BSD-3-Clause
builddeps   :
    - binary(flang)
setup       : |
    %patch %(pkgdir)/0001-Fix-building-with-openblas.patch

    %cmake \
        -DCMAKE_Fortran_COMPILER=flang \
        -DBUILD_SHARED_LIBS=ON \
        -DDYNAMIC_ARCH=ON \
        -DTARGET=GENERIC \
        -DUSE_OPENMP=1 \
build       : |
    %cmake_build
install     : |
    %cmake_install
