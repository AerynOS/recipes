name        : kdecoration
version     : "6.7.4"
release     : 24
upstreams   :
    - https://download.kde.org/stable/plasma/6.7.4/kdecoration-6.7.4.tar.xz : af366baba8694e16226844a94b4772a63a7e8d8d43e4c1950215eb163b4ca590
homepage    : https://kde.org/plasma-desktop/
license     : LGPL-2.1-only
summary     : Plugin based library to create window decorations
