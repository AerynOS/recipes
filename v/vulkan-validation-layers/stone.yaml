name        : vulkan-validation-layers
version     : "1.4.357.0"
release     : 1
homepage    : https://github.com/KhronosGroup/Vulkan-ValidationLayers
upstreams   :
    - https://github.com/KhronosGroup/Vulkan-ValidationLayers/archive/refs/tags/vulkan-sdk-1.4.357.0.tar.gz : 73180b11992a3554e97ebc18e6bf2b45ff9790ded9d87fc526c7bab865d1303f
summary     : Vulkan Validation Layers
description : |
    This package provides the validation layers from the Vulkan SDK, which are
    useful for debugging Vulkan applications.
paths:
    - /usr/lib/*.so
license     : 
    - Apache-2.0
    - Apache-2.0 WITH LLVM-exception
    - BSD-2-Clause
    - BSL-1.0
    - MIT
builddeps   :
    - binary(python3)
    - cmake(SPIRV-Headers)
    - cmake(SPIRV-Tools-opt)
    - cmake(VulkanHeaders)
    - cmake(VulkanUtilityLibraries)
    - pkgconfig(wayland-client)
    - pkgconfig(x11)
    - pkgconfig(xcb)
    - pkgconfig(xrandr)
setup       : |
    %cmake -D UPDATE_DEPS=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
