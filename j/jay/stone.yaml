name        : jay
version     : "1.14.0"
release     : 1
homepage    : https://github.com/mahkoh/jay
upstreams   :
    - https://github.com/mahkoh/jay/archive/refs/tags/v1.14.0.tar.gz : 5064d1ec0016b27953918dcf4a67baa8d9864e36086c06c9f65cc1353fa91bd8
summary     : A Wayland Compositor
description : |
    A lightweight and powerful Wayland Compositor written in Rust.
license     : GPL-3.0-only
networking  : true
builddeps   :
    - pkgconfig(cairo)
    - pkgconfig(gbm)
    - pkgconfig(glib-2.0)
    - pkgconfig(gudev-1.0)
    - pkgconfig(libinput)
    - pkgconfig(pango)
    - pkgconfig(vulkan)
rundeps     :
    - binary(Xwayland)
    - xdg-desktop-portal-gtk
setup       : |
    %cargo_fetch
build       : |
    RUST_BACKTRACE=1 nice %cargo_build
install     : |
    %cargo_install

    %install_file etc/jay.portal %(installroot)%(datadir)/xdg-desktop-portal/portals/jay.portal
    %install_file etc/jay-portals.conf %(installroot)%(datadir)/xdg-desktop-portal/jay-portals.conf
    %install_file etc/jay.desktop %(installroot)%(datadir)/wayland-sessions/jay.desktop

    %install_dir %(installroot)%(datadir)/zsh/site-functions/
    %(cargo_target_dir)/jay generate-completion zsh > %(installroot)%(datadir)/zsh/site-functions/_jay

    %install_dir %(installroot)%(datadir)/bash-completion/completions/
    %(cargo_target_dir)/jay generate-completion bash > %(installroot)%(datadir)/bash-completion/completions/jay

    %install_dir %(installroot)%(datadir)/fish/vendor_completions.d/
    %(cargo_target_dir)/jay generate-completion fish > %(installroot)%(datadir)/fish/vendor_completions.d/jay.fish

    # TODO: When we support setting capabilities make sure to add CAP_SYS_NICE to the jay binary
tuning      :
   - lto: full
