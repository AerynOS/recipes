name        : tclap
version     : "1.2.5"
release     : 1
homepage    : http://tclap.sourceforge.net/
upstreams   :
    - https://downloads.sourceforge.net/project/tclap/tclap-1.2.5.tar.gz : bb649f76dae35e8d0dcba4b52acfd4e062d787e6a81b43f7a4b01275153165a6
summary     : Small, flexible library that provides a simple interface for defining and accessing command line arguments.
description : |
    small, flexible library that provides a simple interface for defining and accessing command line arguments.
license     : MIT
setup       : |
    %configure
build       : |
    %make
install     : |
    %make_install

    # delete docs
    rm -rfv %(installroot)%(datadir)
packages    :
    # Headers only package
    - "%(name)" :
        paths :
            - /*
