name        : talloc
version     : "2.5.0"
release     : 5
homepage    : https://talloc.samba.org/
upstreams   :
    - https://www.samba.org/ftp/talloc/talloc-2.5.0.tar.gz : 912afa237510ae542a7733998eb18a12bcda35ab6729c8e2ddb43e8d0ebab007
summary     : talloc is a hierarchical, reference counted memory pool system with destructors. It is the core memory allocator used in Samba.
description : |
    talloc is a hierarchical, reference counted memory pool system with destructors. It is the core memory allocator used in Samba.
license     :
    - LGPL-3.0-or-later
builddeps   :
    - binary(python)
    - binary(which)
    - pkgconfig(libtirpc)
setup       : |
    %configure \
        --bundled-libraries=NONE \
        --builtin-libraries=replace \
        --disable-rpath-install \
        --disable-python
build       : |
    %make
install     : |
    %make_install
# icf unsupported with bfd
tuning      :
    - icf: false
