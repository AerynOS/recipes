name        : broadcom-sta-module
version     : "6.30.223.271"
release     : 3
homepage    : https://www.broadcom.com/support/download-search?pf=Wireless+LAN+Infrastructure
upstreams   :
    - https://docs.broadcom.com/docs-and-downloads/docs/linux_sta/hybrid-v35_64-nodebug-pcoem-6_30_223_271.tar.gz:
        hash: 5f79774d5beec8f7636b59c0fb07a03108eef1e3fd3245638b20858c714144be
        unpack: false
        rename: broadcom.tar.gz

    - https://salsa.debian.org/broadcom-sta-team/broadcom-sta/-/raw/debian/README.txt:
        hash: 4d6d63f6eb40f84359be06f1f6f26075827a0d25cdaa364d8ccb6561bf162e34
        unpack: false
summary     : Broadcoms IEEE 802.11a/b/g/n hybrid Linux device driver
description : |
    Broadcoms IEEE 802.11a/b/g/n hybrid Linux device driver
license     : Distributable
builddeps   :
    - binary(eu-readelf)
    - binary(zstd)
    - linux-gaming-devel
    - linux-lts-devel
    - linux-stable-devel
environment : |
    # Create list of kernels to build for
    declare -a kernels=()
    for dir in %(libdir)/kernel/*/; do
        dir=${dir%*/}
        kernels+=(${dir##*/})
    done
setup       : |
    for _kernel in ${kernels[@]}; do
        # Debian patches require the source in a certain structure. We imitate that structure even though we don't build for i386
        mkdir -p ${_kernel}/amd64 ${_kernel}/i386
        bsdtar-static -xf %(sourcedir)/broadcom.tar.gz --strip-components=0 -C ${_kernel}/amd64
        bsdtar-static -xf %(sourcedir)/broadcom.tar.gz --strip-components=0 -C ${_kernel}/i386

        pushd ${_kernel}

        # This is basically a hack so that the Debian patches apply cleanly. This file is not installed
        cp %(sourcedir)/README.txt README.txt

        # Also a hack for compat with 01-shipped-module.patch
        mv amd64/lib/wlc_hybrid.o_shipped amd64/lib/wlc_hybrid.o_amd64

        if [[ -f %(pkgdir)/patches/series ]]
        then
            # This retains patch order while removings blank lines
            # and lines starting with a # character (with any number of preceding blanks)
            # which should make the patch series file nicer to maintain due to comment support
            PATCHES=($(sed -E -e '/^\s*$/d' -e '/^[[:space:]]*#.*$/d' %(pkgdir)/patches/series))
            for p in "${PATCHES[@]}"
            do
                %patch "%(pkgdir)/patches/${p}"
            done
        fi

        # Might as well delete the i386 directory since we don't need it
        rm -rf i386
        popd
    done
build       : |
    for _kernel in ${kernels[@]}; do
        pushd ${_kernel}/amd64
        %ccache_zero
        export CCACHE_BASEDIR="${PWD}"
        %make LLVM=1 KBASE="%(libdir)/modules/${_kernel}" KERNELRELEASE=${_kernel}
        %ccache_stats
        popd
    done
install     : |
    %install_file %(pkgdir)/modprobe.conf %(installroot)%(libdir)/modprobe.d/broadcom-wl.conf

    for _kernel in ${kernels[@]}; do
        pushd ${_kernel}/amd64
        %install_file wl.ko -t %(installroot)%(libdir)/modules/${_kernel}/extra/wireless/

        # Manually construct the debug info from the kernel modules
        %install_dir %(installroot)%(libdir)/debug/.build-id
        pushd %(installroot)%(libdir)/modules/${_kernel}
        module_list=()
        while IFS=  read -r -d $'\0'; do
            module_list+=("$REPLY")
        done < <(find . -type f -name "*.ko" -print0)
        for module in "${module_list[@]}"; do
            build_id=$(eu-readelf -n ${module} | awk '/Bui/ {print $3}')
            debug_path="%(libdir)/debug/.build-id/${build_id:0:2}/${build_id: 2}.debug"

            pushd $(dirname ${module})
            file=$(basename ${module})

            llvm-objcopy --only-keep-debug "${file}" "${file}.debug"
            llvm-objcopy --add-gnu-debuglink "${file}.debug" "${file}"
            llvm-strip -g --strip-unneeded "${file}"
            %install_file "${file}.debug" "%(installroot)/${debug_path}"
            rm -v "${file}.debug"

            popd
        done
        popd

        # Compress modules with zstd
        find "%(installroot)%(libdir)/modules/${_kernel}/" -name '*.ko' -print -exec zstd {} \; -exec rm -v {} \;

        popd
    done
packages    :
    # TODO: Make %(name) a virtual package that uses conditional rundeps to pull in the correct package depending on kernel(s) installed

    - "%(name)-gaming":
        summary: "%(name) built for gaming kernel"
        description: "%(name) built for gaming kernel"
        rundeps:
            - "%(name)-shared"
            - sysbinary(depmod)
            - linux-gaming
        paths:
            - /usr/lib/kernel/*.gaming/
            - /usr/lib/modules/*.gaming/

    - "%(name)-lts":
        summary: "%(name) built for LTS kernel"
        description: "%(name) built for LTS kernel"
        rundeps:
            - "%(name)-shared"
            - sysbinary(depmod)
            - linux-lts
        paths:
            - /usr/lib/kernel/*.lts/
            - /usr/lib/modules/*.lts/

    - "%(name)-stable":
        summary: "%(name) built for stable kernel"
        description: "%(name) built for stable kernel"
        rundeps:
            - "%(name)-shared"
            - sysbinary(depmod)
            - linux-stable
        paths:
            - /usr/lib/kernel/*.stable/
            - /usr/lib/modules/*.stable/

    - "%(name)-shared":
        summary: Shared components for %(name)
        description: Shared components for %(name)
        paths:
            - /usr/lib/modprobe.d/
            - /usr/lib/modules-load.d/
